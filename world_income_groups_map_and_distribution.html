const getColor = (id) => {
  const d = countryData[String(id)];
  if (!d) return "#ccc";
  return incomeGroups[d.group]?.color || "#ccc";
};

const tooltip = document.getElementById("tooltip");

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const width = document.getElementById("map").offsetWidth || 700;
  const height = Math.round(width * 0.5);

  const svg = d3.select("#map").append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("width", "100%");

  const projection = d3.geoNaturalEarth1()
    .scale(width / 6.3)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath(projection);

  svg.append("rect")
    .attr("width", width).attr("height", height)
    .attr("fill", isDark ? "#1a1a1a" : "#e8f4f8")
    .attr("rx", 6);

  svg.selectAll("path")
    .data(topojson.feature(world, world.objects.countries).features)
    .join("path")
    .attr("d", path)
    .attr("fill", d => getColor(d.id))
    .attr("stroke", isDark ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.6)")
    .attr("stroke-width", 0.4)
    .style("cursor", "pointer")
    .on("mousemove", function(event, d) {
      const info = countryData[String(d.id)];
      if (!info) return;
      const rect = document.getElementById("map").getBoundingClientRect();
      tooltip.style.display = "block";
      tooltip.style.left = (event.clientX - rect.left + 10) + "px";
      tooltip.style.top = (event.clientY - rect.top - 40) + "px";
      tooltip.innerHTML = `<strong>${info.name}</strong><br>
        <span style="color:var(--color-text-secondary)">${info.group}</span><br>
        GNI/capita: <strong>$${info.gni.toLocaleString()}</strong>`;
    })
    .on("mouseleave", function() {
      tooltip.style.display = "none";
    });

  drawDotPlot();
});

function drawDotPlot() {
  const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const countries = Object.values(countryData).sort((a, b) => a.gni - b.gni);
  const w = document.getElementById("dotplot").offsetWidth || 700;
  const h = 110;
  const margin = { left: 48, right: 20, top: 16, bottom: 32 };
  const innerW = w - margin.left - margin.right;
  const innerH = h - margin.top - margin.bottom;

  const svg = d3.select("#dotplot").append("svg")
    .attr("viewBox", `0 0 ${w} ${h}`)
    .attr("width", "100%");

  const xScale = d3.scaleLog()
    .domain([300, 110000])
    .range([0, innerW]);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const thresholds = [
    { x: xScale(1145), label: "$1,145", color: "#d73027" },
    { x: xScale(4515), label: "$4,515", color: "#fc8d59" },
    { x: xScale(14005), label: "$14,005", color: "#4393c3" }
  ];

  thresholds.forEach(t => {
    g.append("line")
      .attr("x1", t.x).attr("x2", t.x)
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", isDark ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.15)")
      .attr("stroke-dasharray", "3,2")
      .attr("stroke-width", 1);
    g.append("text")
      .attr("x", t.x).attr("y", -4)
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", isDark ? "rgba(255,255,255,0.45)" : "rgba(0,0,0,0.4)")
      .text(t.label);
  });

  const jitter = () => (Math.random() - 0.5) * (innerH * 0.6);
  const cy = innerH / 2;

  g.selectAll("circle")
    .data(countries)
    .join("circle")
    .attr("cx", d => xScale(d.gni))
    .attr("cy", d => cy + jitter())
    .attr("r", 4)
    .attr("fill", d => incomeGroups[d.group]?.color || "#ccc")
    .attr("opacity", 0.78)
    .style("cursor", "pointer")
    .on("mousemove", function(event, d) {
      const rect = document.getElementById("dotplot").getBoundingClientRect();
      tooltip.style.display = "block";
      tooltip.style.left = (event.clientX - rect.left + 10) + "px";
      tooltip.style.top = (event.clientY - rect.top - 40) + "px";
      tooltip.innerHTML = `<strong>${d.name}</strong><br>
        <span style="color:var(--color-text-secondary)">${d.group}</span><br>
        GNI/capita: <strong>$${d.gni.toLocaleString()}</strong>`;
    })
    .on("mouseleave", function() {
      tooltip.style.display = "none";
    });

  const xAxis = d3.axisBottom(xScale)
    .tickValues([300, 1000, 3000, 10000, 30000, 100000])
    .tickFormat(d => "$" + (d >= 1000 ? (d/1000).toFixed(0) + "k" : d));

  g.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(xAxis)
    .selectAll("text")
    .attr("font-size", "11px")
    .attr("fill", isDark ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.55)");

  g.select(".domain").attr("stroke", isDark ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.2)");
  g.selectAll(".tick line").attr("stroke", isDark ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.2)");
}
